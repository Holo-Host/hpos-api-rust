[package]
name = "hpos-api-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
base36 = "=0.0.1"
base64 = "0.13.0"
ed25519-dalek = { version = "2.1.1" }
env_logger = "0.11.3"
getrandom = "0.2.7"

holochain_websocket = "=0.5.3"
holochain_client = "=0.7.1"
holochain_keystore = "=0.5.3"
holochain_types = { version = "=0.5.3"}
holochain_conductor_api = "=0.5.3"
holofuel_types = { git = "https://github.com/holo-host/holofuel", rev = "ef7a5116f0774aa08579182ca1de758d5f38a0e2" }
mr_bundle = "=0.5.3"

hpos_hc_connect = { git = "https://github.com/holo-host/hpos-service-crates.git", rev = "b79cdd7e6f2d70b14fe677ece08546c13d924838" }
holochain_env_setup = { git = "https://github.com/holo-host/hpos-service-crates.git", rev = "b79cdd7e6f2d70b14fe677ece08546c13d924838" }
hpos-config-core = { git = "https://github.com/holo-host/hpos-config.git", rev = "77d740c83a02e322e670e360eb450076b593b328" }
hpos-config-seed-bundle-explorer = { git = "https://github.com/holo-host/hpos-config.git", rev = "77d740c83a02e322e670e360eb450076b593b328" }

log = "0.4.17"
rand = "0.8.5"
rocket = { version = "0.5.0-rc.3", features = ["json"] }
serde = { version = "1.0", features = ["derive", "rc",] }
serde_bytes = "0.11"
serde_yaml = "0.9.25"
sodoken = "0.1.0"
url2 = "0.0.6"
url = "2.4.0"
chrono = "0.4.19"
reqwest = "0.12.5"
indexmap = "2.0"
holochain_serialized_bytes = "*"
